name: Data feed

# Rebuilds the football data from Wikidata every week and publishes it to
# GitHub Pages, where the app (js/datafeed.js) picks it up on launch.
# Nothing is published unless the content tests pass on the new data.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/data/lists.js'
      - 'js/data/ladders.js'
      - 'js/data/seasons.js'
      - 'tools/build-data.js'
      - 'tools/publish-feed.js'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full Wikidata + Wikipedia rebuild is rate-limited to roughly an hour.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild data from Wikidata
        run: node tools/build-data.js
      - name: Content tests
        run: node --test test/content.test.js
      - name: Package feed
        run: node tools/publish-feed.js _site/feed/v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
