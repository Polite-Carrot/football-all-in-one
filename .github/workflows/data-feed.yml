name: Data feed

# Publishes football-all-in-one.politecarrot.com: the playable web game at the
# root, the Versus link page at /play/, and the football data feed at /feed/v1/
# that the apps (js/datafeed.js) check on launch.
# The weekly and manual runs rebuild the data from Wikidata + Wikipedia
# (about an hour); pushes publish the committed data in a minute or two.
# Nothing is published unless the content tests pass.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'fonts.css'
      - 'js/**'
      - 'assets/**'
      - 'site/**'
      - 'sync-web.js'
      - 'sync-dependencies.js'
      - 'tools/build-data.js'
      - 'tools/publish-feed.js'
      - '.github/workflows/data-feed.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full Wikidata + Wikipedia rebuild is rate-limited to roughly an hour.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild data from Wikidata
        if: github.event_name != 'push'
        run: node tools/build-data.js
      - name: Content tests
        run: node --test test/content.test.js
      - name: Build the web game
        run: WEB_ONLY=1 node sync-web.js && mkdir -p _site && cp -R www/. _site/
      - name: Package feed
        run: node tools/publish-feed.js _site/feed/v1
      - name: Add the Versus link page
        run: cp -R site/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
